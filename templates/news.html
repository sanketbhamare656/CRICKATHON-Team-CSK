<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL News Room — Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #38bdf8; --bg: #0f172a; --text: #f8fafc;
            --card-bg: #1e293b; --border: rgba(255,255,255,0.1);
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding-top: 80px; }
        
        header { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 100; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--primary); text-decoration: none; }
        nav a { text-decoration: none; color: #94a3b8; font-size: 14px; margin-left: 20px; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 48px; margin-bottom: 30px; border-left: 5px solid var(--primary); padding-left: 20px; }
        
        .news-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .news-item { background: var(--card-bg); border: 1px solid var(--border); padding: 25px; border-radius: 16px; transition: 0.3s; text-decoration: none; color: inherit; display: flex; justify-content: space-between; align-items: center; }
        .news-item:hover { border-color: var(--primary); transform: translateX(10px); background: #24334d; }
        .news-content { flex: 1; }
        .news-meta { font-size: 11px; text-transform: uppercase; color: var(--primary); font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
        .news-title { font-size: 18px; font-weight: 600; line-height: 1.4; }
        .news-arrow { color: var(--primary); font-size: 24px; margin-left: 20px; opacity: 0.5; }

        .loading-state { text-align: center; padding: 100px; color: #94a3b8; }
        
        footer { margin-top: 60px; padding: 40px; text-align: center; color: #475569; font-size: 13px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<header>
    <a href="/" class="logo">IPL PULSE</a>
    <nav>
        <a href="/">Home</a>
        <a href="/live-score">Live Score</a>
        <a href="/news" class="active">Headlines</a>
    </nav>
</header>

<div class="container">
    <h1 class="page-title">Latest IPL Headlines</h1>
    
    <div id="news-container" class="news-grid">
        <div class="loading-state">Scraping the latest headlines for you...</div>
    </div>
</div>

<footer>
    &copy; 2026 IPL Pulse Room — Live from Google News Global.
</footer>

<script>
    async function loadNews() {
        try {
            const res = await fetch('/api/news');
            const data = await res.json();
            const container = document.getElementById('news-container');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="loading-state">No news headlines found at the moment. Check back soon!</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <a href="${item.link}" target="_blank" class="news-item">
                    <div class="news-content">
                        <div class="news-meta">JUST IN • ${item.source}</div>
                        <div class="news-title">${item.title}</div>
                    </div>
                    <div class="news-arrow">→</div>
                </a>
            `).join('');
        } catch (e) {
            console.error(e);
            document.getElementById('news-container').innerHTML = '<div class="loading-state">Failed to load news. Please try again later.</div>';
        }
    }

    loadNews();
</script>
</body>
</html>
